<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SkillWise Global Error Page</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f48c25",
                        "background-light": "#f8f7f5",
                        "background-dark": "#1a130d",
                        "card-light": "#ffffff",
                        "card-dark": "#251b12",
                        "border-light": "#e8dbce",
                        "border-dark": "#3a322b",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .icon-filled { font-variation-settings: 'FILL' 1; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e8dbce; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #3a322b; }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-[#1c140d] dark:text-gray-100 flex h-screen overflow-hidden font-display">
<div class="flex-1 flex flex-col h-full relative">
<header class="h-16 bg-white dark:bg-card-dark border-b border-border-light dark:border-border-dark flex items-center px-6 shrink-0 z-30 transition-colors duration-200">
<div class="flex items-center gap-3">
<div class="flex items-center justify-center size-9 rounded-lg bg-primary/10 text-primary">
<span class="material-symbols-outlined icon-filled">school</span>
</div>
<h1 class="text-xl font-bold tracking-tight text-[#1c140d] dark:text-white">SkillWise</h1>
</div>
</header>
<main class="flex-1 flex flex-col items-center justify-center p-6 overflow-hidden">
<div class="max-w-md w-full text-center space-y-8 animate-in fade-in zoom-in duration-500">
<div class="relative inline-block mb-2">
<div class="absolute inset-0 bg-orange-100 dark:bg-orange-900/20 rounded-full blur-2xl opacity-60"></div>
<div class="relative text-[80px] leading-none select-none drop-shadow-sm">😕</div>
</div>
<div class="space-y-3">
<h2 class="text-3xl font-bold text-[#1c140d] dark:text-white tracking-tight">Something went wrong</h2>
<p class="text-gray-500 dark:text-gray-400 text-lg leading-relaxed">
                    We couldn’t load this page or an unexpected error occurred.
                </p>
</div>
<div class="flex flex-col sm:flex-row gap-4 justify-center pt-2">
<a class="inline-flex items-center justify-center px-6 py-3 rounded-xl bg-primary hover:bg-[#e07b1a] text-white font-semibold shadow-lg shadow-orange-200 dark:shadow-none transition-all hover:scale-[1.02] active:scale-[0.98]" href="#">
                    Go to Home
                </a>
<button class="inline-flex items-center justify-center px-6 py-3 rounded-xl bg-white dark:bg-card-dark border border-gray-200 dark:border-gray-700 text-gray-700 dark:text-gray-200 font-semibold hover:bg-gray-50 dark:hover:bg-gray-800 transition-all hover:scale-[1.02] active:scale-[0.98]" onclick="window.location.reload()">
<span class="material-symbols-outlined text-[20px] mr-2">refresh</span>
                    Retry
                </button>
</div>
<div class="pt-8 border-t border-dashed border-gray-200 dark:border-gray-800 w-full max-w-[280px] mx-auto">
<p class="text-sm text-gray-400 dark:text-gray-500">
                    If the problem continues, <a class="text-primary hover:text-orange-600 hover:underline font-medium transition-colors" href="#">contact support</a>.
                </p>
</div>
</div>
</main>
</div>

</body></html>
