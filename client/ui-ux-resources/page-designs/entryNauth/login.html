<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - InterviewPlatform</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#EA580C", 
                        "background-light": "#F8F8F4",
                        "background-dark": "#1C1917", 
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-[#292524] dark:text-[#E7E5E4] transition-colors duration-200">
<div class="relative flex min-h-screen flex-col overflow-hidden">
<header class="flex items-center justify-between whitespace-nowrap border-b border-solid border-[#E7E5E4] dark:border-[#44403C] px-6 lg:px-10 py-4 bg-white dark:bg-[#1C1917]">
<div class="flex items-center gap-4 text-[#292524] dark:text-[#E7E5E4] cursor-pointer">
<div class="size-8 text-primary flex items-center justify-center">
<span class="material-symbols-outlined text-[32px] fill-current">school</span>
</div>
<h2 class="text-lg font-bold leading-tight tracking-[-0.015em]">SkillWise</h2>
</div>
<div class="hidden sm:block">
</div>
</header>
<main class="flex-grow flex flex-col items-center justify-center p-4 sm:px-6 lg:px-8">
<div class="w-full max-w-[480px]">
<div class="bg-white dark:bg-[#292524] shadow-xl rounded-xl border border-[#E7E5E4] dark:border-[#44403C] overflow-hidden">
<div class="px-6 py-8 sm:p-10">
<div class="text-center mb-8">
<h1 class="text-2xl font-bold leading-tight tracking-[-0.015em] text-[#292524] dark:text-[#E7E5E4]">Welcome back</h1>
<p class="mt-2 text-base font-normal leading-normal text-[#57534E] dark:text-[#A8A29E]">Please enter your details to sign in.</p>
</div>
<form action="#" class="space-y-6" method="POST">
<div class="space-y-2">
<label class="block text-base font-medium leading-normal text-[#292524] dark:text-[#D6D3D1]" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-[#78716C] dark:text-[#A8A29E]">
<span class="material-symbols-outlined text-[20px]">mail</span>
</div>
<input autocomplete="email" class="block w-full pl-10 pr-3 py-3 border border-[#D6D3D1] dark:border-[#57534E] rounded-lg bg-[#FAFAF9] dark:bg-[#1C1917] text-[#292524] dark:text-[#E7E5E4] placeholder-[#A8A29E] dark:placeholder-[#78716C] focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary sm:text-base transition-colors h-12" id="email" name="email" placeholder="Enter your email" required="" type="email"/>
</div>
</div>
<div class="space-y-2">
<label class="block text-base font-medium leading-normal text-[#292524] dark:text-[#D6D3D1]" for="password">Password</label>
<div class="relative flex items-center">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-[#78716C] dark:text-[#A8A29E]">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input autocomplete="current-password" class="block w-full pl-10 pr-10 py-3 border border-[#D6D3D1] dark:border-[#57534E] rounded-lg bg-[#FAFAF9] dark:bg-[#1C1917] text-[#292524] dark:text-[#E7E5E4] placeholder-[#A8A29E] dark:placeholder-[#78716C] focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary sm:text-base transition-colors h-12" id="password" name="password" placeholder="Enter your password" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-[#78716C] dark:text-[#A8A29E] hover:text-primary transition-colors cursor-pointer" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<div class="flex items-center justify-between">
<div class="flex items-center">
<input class="h-4 w-4 rounded border-[#D6D3D1] text-primary focus:ring-primary bg-[#FAFAF9] dark:bg-[#1C1917] dark:border-[#57534E]" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block text-sm text-[#57534E] dark:text-[#A8A29E]" for="remember-me">Remember me</label>
</div>
<div class="text-sm">
<a class="font-medium text-primary hover:text-primary/80 transition-colors" href="#">Forgot password?</a>
</div>
</div>
<button class="w-full flex justify-center items-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-bold text-white bg-primary hover:bg-[#C2410C] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary h-12 transition-all" type="submit">
                            Sign In
                        </button>
</form>
<div class="mt-6">
<div class="relative">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-[#E7E5E4] dark:border-[#44403C]"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-2 bg-white dark:bg-[#292524] text-[#57534E] dark:text-[#A8A29E]">Or continue with</span>
</div>
</div>
<div class="mt-6 grid grid-cols-2 gap-3">
<a class="w-full inline-flex justify-center items-center py-2.5 px-4 border border-[#D6D3D1] dark:border-[#57534E] rounded-lg shadow-sm bg-white dark:bg-[#1C1917] text-sm font-medium text-[#57534E] dark:text-[#D6D3D1] hover:bg-[#F5F5F4] dark:hover:bg-[#292524] transition-colors" href="#">
<svg aria-hidden="true" class="h-5 w-5 mr-2" fill="currentColor" viewBox="0 0 24 24"><path d="M12.545,10.239v3.821h5.445c-0.712,2.315-2.647,3.972-5.445,3.972c-3.332,0-6.033-2.701-6.033-6.032s2.701-6.032,6.033-6.032c1.498,0,2.866,0.549,3.921,1.453l2.814-2.814C17.503,2.988,15.139,2,12.545,2C7.021,2,2.543,6.477,2.543,12s4.478,10,10.002,10c8.396,0,10.249-7.85,9.426-11.748L12.545,10.239z"></path></svg>
                                Google
                            </a>
<a class="w-full inline-flex justify-center items-center py-2.5 px-4 border border-[#D6D3D1] dark:border-[#57534E] rounded-lg shadow-sm bg-white dark:bg-[#1C1917] text-sm font-medium text-[#57534E] dark:text-[#D6D3D1] hover:bg-[#F5F5F4] dark:hover:bg-[#292524] transition-colors" href="#">
<svg aria-hidden="true" class="h-5 w-5 mr-2" fill="currentColor" viewBox="0 0 24 24"><path clip-rule="evenodd" d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z" fill-rule="evenodd"></path></svg>
                                LinkedIn
                            </a>
</div>
<div class="mt-8 text-center">
<span class="text-sm text-[#57534E] dark:text-[#A8A29E]">Don't have an account?</span>
<a class="text-sm font-bold text-primary hover:underline ml-1" href="#">Sign up</a>
</div>
</div>
</div>
<div class="px-6 py-4 bg-[#F5F5F4] dark:bg-[#0C0A09] border-t border-[#E7E5E4] dark:border-[#44403C] flex flex-col items-center justify-center gap-2">
<p class="text-sm text-[#57534E] dark:text-[#A8A29E] block sm:hidden">
                        New here? <a class="font-bold text-primary hover:underline" href="#">Create a company account</a>
</p>
<div class="flex items-center text-xs text-[#78716C] dark:text-[#78716C] gap-1">
<span class="material-symbols-outlined text-[14px]">lock</span>
<span>Secure login • Privacy protected</span>
</div>
</div>
</div>
</div>
</main>
</div>
</body></html>
