<!DOCTYPE html>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;family=Noto+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>

<div class="bg-white dark:bg-surface-dark border border-gray-200 dark:border-gray-700 shadow-xl rounded-2xl p-2 flex items-center justify-between gap-4">

<button class="size-12 rounded-xl flex items-center justify-center text-text-main hover:bg-gray-100 dark:text-white dark:hover:bg-gray-800 transition-colors tooltip" title="Toggle Microphone">
<span class="material-symbols-outlined">mic</span>
</button>
<button class="size-12 rounded-xl flex items-center justify-center text-text-main hover:bg-gray-100 dark:text-white dark:hover:bg-gray-800 transition-colors tooltip" title="Toggle Camera">
<span class="material-symbols-outlined">videocam</span>

<button class="size-12 rounded-xl flex items-center justify-center text-text-main hover:bg-gray-100 dark:text-white dark:hover:bg-gray-800 transition-colors tooltip" title="Settings">

<button class="flex-1 bg-primary hover:bg-primary-dark text-white h-12 rounded-xl font-bold text-sm tracking-wide shadow-md shadow-primary/20 flex items-center justify-center gap-2 transition-all transform hover:scale-[1.02]">
