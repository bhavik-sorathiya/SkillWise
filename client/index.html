<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkillWise - Interviews that feel effortless</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#FF6B00",
              "background-light": "#F3F4F6",
              "background-dark": "#111827",
              "surface-light": "#FFFFFF",
              "surface-dark": "#1F2937",
            },
            fontFamily: {
              display: ["Outfit", "sans-serif"],
              body: ["Inter", "sans-serif"],
            },
            borderRadius: {
              DEFAULT: "0.75rem",
              'xl': "1rem",
              '2xl': "1.5rem",
              '3xl': "2rem",
            },
            boxShadow: {
              'soft': '0 20px 40px -15px rgba(0, 0, 0, 0.1)',
              'glow': '0 0 20px rgba(255, 107, 0, 0.3)',
            }
          },
        },
      };
    </script>
    
    <style>
      @keyframes float {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(1deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      .animate-float {
        animation: float 6s ease-in-out infinite;
      }
      .animate-float-delayed {
        animation: float 7s ease-in-out infinite;
        animation-delay: 1s;
      }
      .animate-float-slow {
        animation: float 8s ease-in-out infinite;
        animation-delay: 2s;
      }
      .bg-grid {
        background-size: 40px 40px;
        background-image: radial-gradient(circle, #e5e7eb 1px, transparent 1px);
      }
      .dark .bg-grid {
        background-image: radial-gradient(circle, #374151 1px, transparent 1px);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
